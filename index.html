<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Za Klementino</title>
  <meta name="description" content="Šopek vrtnic za Klementino.">
  <meta name="theme-color" content="#FADDE7">
  <meta property="og:title" content="Za Klementino">
  <meta property="og:description" content="Šopek vrtnic, ki zacveti samo zate.">
  <meta property="og:type" content="website">
  <!-- Ko bo og-image.png narejena, odkomentiraj:
  <meta property="og:image" content="https://klementina50.vercel.app/og-image.png"> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">
  <main class="stage" aria-label="Šopek vrtnic">
    <svg id="scene" viewBox="0 70 360 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Šopek rožnatih vrtnic">
      <g id="idle"><g id="tap"></g></g>
    </svg>
  </main>

  <footer class="note">
    <p class="thought">Rož nikoli ni preveč.<br>Naj ti danes zacveti dan!</p>
    <p class="sign">Tjaš</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
